<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEC · 每日一题</title>
  <style>
    :root{--ink:#071a35;--muted:#64758d;--blue:#1478ff;--cyan:#39d6ff;--line:rgba(17,65,126,.13);--card:rgba(255,255,255,.84)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(122deg,#e7f4ff,#fff 45%,#edf5ff);overflow-x:hidden}body:after{content:"";position:fixed;width:760px;height:760px;right:-260px;top:-350px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(49,197,255,.42),rgba(20,120,255,.08) 45%,transparent 69%)}.shell{width:min(1180px,calc(100% - 40px));margin:auto;padding:28px 0 50px}nav{display:flex;align-items:center;justify-content:space-between;padding:12px 17px;border:1px solid #fff;border-radius:20px;background:#ffffff9f;box-shadow:0 15px 45px #1b529719;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:800;letter-spacing:.08em}.brand-logo{width:38px;height:38px;display:block;flex:0 0 auto;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px #0b4a9740}.nav-tag{color:#2a70c7;font-size:13px;padding:8px 12px;border-radius:10px;background:#eaf4ff}main{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:42px;min-height:calc(100vh - 142px);padding:70px 22px}.eyebrow{display:flex;align-items:center;gap:12px;color:#177bff;font-size:13px;letter-spacing:.24em;font-weight:800}.eyebrow:before{content:"";width:36px;height:2px;background:var(--blue)}h1{margin:18px 0 14px;font-size:clamp(43px,6vw,78px);line-height:1.05;letter-spacing:-.07em;font-weight:900}h1 em{color:var(--blue);font-style:normal}.lead{max-width:520px;margin:0;color:var(--muted);line-height:1.9;font-size:16px}.date{display:inline-flex;margin-top:26px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;color:#47719d;font-size:13px;background:#ffffff80}.problem-card{position:relative;overflow:hidden;padding:30px;border:1px solid #fff;border-radius:28px;background:var(--card);box-shadow:0 28px 70px #1455a028;backdrop-filter:blur(18px)}.problem-card:before{content:"";position:absolute;width:160px;height:160px;right:-50px;top:-62px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--blue));opacity:.2}.card-top{display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative}.daily{color:#fff;background:var(--blue);padding:7px 11px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.08em}.level{color:#b66e00;font-size:13px;font-weight:700}h2{position:relative;margin:25px 0 10px;font-size:29px;letter-spacing:-.03em}.source{margin:0;color:#78889c;font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:21px 0 25px}.tags span{padding:6px 10px;color:#27639f;font-size:12px;border-radius:7px;background:#e9f4ff}.quote{margin:0 0 26px;padding:15px 16px;border-left:3px solid var(--cyan);color:#4f6680;background:#edf7ffb3;line-height:1.7;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions .share{grid-column:1/-1}button,a.button{border:0;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:47px;padding:0 18px;border-radius:12px;transition:.2s transform,.2s box-shadow}button:hover,a.button:hover{transform:translateY(-2px)}.primary{color:#fff;background:linear-gradient(108deg,#1489ff,#1266e9);box-shadow:0 10px 21px #1478ff45}.secondary{color:#2771c8;background:#eaf4ff}.hint{margin:15px 0 0;color:#8a98ab;font-size:12px;text-align:center}.footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:18px;color:#718198;font-size:12px}#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,25px);padding:11px 16px;color:#fff;font-size:14px;border-radius:10px;background:#071a35;box-shadow:0 12px 30px #071a3540;opacity:0;pointer-events:none;transition:.25s}#toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:780px){.shell{width:min(100% - 24px,600px);padding-top:max(12px,env(safe-area-inset-top))}main{grid-template-columns:1fr;gap:38px;min-height:auto;padding:65px 4px 45px}h1{font-size:54px}.problem-card{padding:24px}.footer{display:block;line-height:2}.nav-tag{display:none}}@media(max-width:480px){.shell{width:calc(100% - 28px);padding-bottom:calc(28px + env(safe-area-inset-bottom))}nav{padding:10px 13px;border-radius:16px}.brand{font-size:15px}.brand-logo{width:33px;height:33px}main{gap:30px;padding:44px 0 32px}.eyebrow{font-size:11px;letter-spacing:.18em}.eyebrow:before{width:25px}h1{margin:14px 0;font-size:clamp(42px,13vw,52px);letter-spacing:-.08em}.lead{font-size:14px;line-height:1.8}.date{margin-top:20px;font-size:12px;white-space:nowrap}.problem-card{padding:22px 18px;border-radius:22px}.card-top{align-items:flex-start}.daily{font-size:10px;padding:7px 9px}.level{padding-top:4px;font-size:12px}h2{margin:20px 0 8px;font-size:24px;line-height:1.25}.source{font-size:13px}.tags{margin:18px 0}.quote{margin-bottom:20px;padding:13px 14px;font-size:13px}.actions{grid-template-columns:1fr}.actions .share{grid-column:auto}button,a.button{min-height:52px;font-size:15px}.hint{margin-top:13px;line-height:1.55}.footer{font-size:11px;padding-top:15px}}
  </style>
</head>
<body>
  <div class="shell">
    <nav><div class="brand"><img class="brand-logo" src="assets/lec-logo.png" alt="LEC Software League 标志"><span>LEC · DAILY</span></div><span class="nav-tag">LEC 招新 · 每日一题计划</span></nav>
    <main>
      <section><div class="eyebrow">LEC DAILY PROBLEM</div><h1>把今天的<br><em>思考</em>写成代码。</h1><p class="lead">每天两题，稳步积累。从读题、试错到实现，与 LEC 一起保持好奇，持续精进。</p><div class="date" id="dateLabel"></div></section>
      <section class="problem-card"><div class="card-top"><span class="daily">TODAY'S PROBLEMS</span><span class="level">每日两题</span></div><h2 id="problemTitle"></h2><p class="source" id="source"></p><div class="tags" id="tags"></div><p class="quote" id="description"></p><div class="actions"><a id="problemOne" class="button primary" target="_blank" rel="noopener">打开题目 1 →</a><a id="problemTwo" class="button secondary" target="_blank" rel="noopener">打开题目 2 →</a><button class="secondary share" id="share">复制今日发送文案</button></div><p class="hint">分享链接会固定展示当天的两道题。</p></section>
    </main><footer class="footer"><span>LEC · Learn · Explore · Create</span><span>每天两题 · 不止两题</span></footer>
  </div><div id="toast" role="status"></div>
  <script>
    // 上线后填入完整站点地址，例如：https://daily.lec-team.cn
    const SITE_URL = '';
    const problemDays = {
      '2026-08-14': ['P1152','P1428'], '2026-08-15': ['P5707','P5731'], '2026-08-16': ['P1011','B2107'], '2026-08-17': ['P1307','U329558'],
      '2026-08-18': ['P2669','U323869'], '2026-08-19': ['P1014','U322984'], '2026-08-20': ['U460960','U322553'], '2026-08-21': ['P1739','P3397'],
      '2026-08-22': ['P1957','P1553'], '2026-08-23': ['P1003','U460484'], '2026-08-24': ['P5733','P1765'], '2026-08-25': ['P5705','P5734'],
      '2026-08-26': ['P5015','P1321'], '2026-08-27': ['P1914','P1308'], '2026-08-28': ['P1603','P1597'], '2026-08-29': ['P3741','P1200'],
      '2026-08-30': ['P1217','P5736']
    };
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const params = new URLSearchParams(location.search); const fromLink = params.get('date');
    const date = fromLink && /^\d{4}-\d{2}-\d{2}$/.test(fromLink) ? new Date(`${fromLink}T00:00:00`) : new Date();
    const dateKey = fmt(date); const pair = problemDays[dateKey];
    const el = id => document.getElementById(id); el('dateLabel').textContent = `${dateKey.replaceAll('-',' / ')} · LEC 每日两题`;
    const toast = text => { el('toast').textContent=text; el('toast').classList.add('show'); setTimeout(()=>el('toast').classList.remove('show'),2200); };
    if (pair) {
      const [one,two] = pair; el('problemTitle').textContent = `${one}  ·  ${two}`; el('source').textContent = '洛谷（Luogu）· 两道练习题'; el('description').textContent = '先完成题目 1 热身，再挑战题目 2。写完后记得复盘：这道题最关键的思路是什么？'; el('tags').innerHTML = '<span>算法练习</span><span>洛谷</span><span>每日打卡</span>';
      el('problemOne').href=`https://www.luogu.com.cn/problem/${one}`; el('problemTwo').href=`https://www.luogu.com.cn/problem/${two}`;
      el('share').onclick=async()=>{const base=SITE_URL||(location.protocol==='file:'?'':`${location.origin}${location.pathname}`);const url=base?`${base}?date=${dateKey}`:'请上线网页后填写 SITE_URL';const text=`【LEC 每日两题 · ${dateKey}】\n1. https://www.luogu.com.cn/problem/${one}\n2. https://www.luogu.com.cn/problem/${two}\n一起打卡，今天也要有收获！\n${url}`;try{await navigator.clipboard.writeText(text);toast('今日发送文案已复制')}catch{prompt('复制下面的今日发送文案：',text)}};
    } else {
      el('problemTitle').textContent='今日题目尚未发布'; el('source').textContent='请在题库中补充当天的两道题'; el('description').textContent='当前题库已配置 2026 年 8 月 14 日至 8 月 30 日。新增日期和两道洛谷题号后，页面会自动展示。'; el('tags').innerHTML='<span>等待更新</span>'; el('problemOne').style.display='none'; el('problemTwo').style.display='none'; el('share').textContent='复制日期'; el('share').onclick=async()=>{try{await navigator.clipboard.writeText(dateKey);toast('日期已复制')}catch{prompt('复制日期：',dateKey)}};
    }
  </script>
</body>
</html>
